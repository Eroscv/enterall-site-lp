<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterall — Em manutenção</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#1c3f8a;
    background:radial-gradient(ellipse at top, #2a4f9e 0%, #12285c 100%);
    color:#fffcf0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align:center;
    padding:32px;
  }
  .wrap{ max-width:560px; }
  .logo{
    font-size:15px;
    font-weight:800;
    letter-spacing:0.02em;
    margin-bottom:48px;
    opacity:0.9;
  }
  .icon{
    width:64px; height:64px;
    margin:0 auto 28px;
    border-radius:50%;
    border:1.5px solid rgba(255,252,240,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{width:28px; height:28px; stroke:#9fe870; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  h1{
    font-size:clamp(26px,4vw,38px);
    font-weight:700;
    line-height:1.3;
    margin-bottom:16px;
  }
  p{
    font-size:16px;
    line-height:1.6;
    color:rgba(255,252,240,0.75);
    font-weight:300;
    max-width:40ch;
    margin:0 auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">ENTERALL</div>
    <div class="icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5l3 3"/></svg>
    </div>
    <h1>Estamos em manutenção</h1>
    <p>Estamos fazendo algumas melhorias por aqui. Voltamos em breve — obrigado pela paciência.</p>
  </div>
</body>
</html>
